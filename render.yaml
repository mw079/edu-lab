# Render blueprint (render.com → New → Blueprint → this repository). One free web service runs everything.
# Render asks for the API key when the blueprint is created; it is never stored in the repository. Anyone with the
# link can create lessons, up to EDU_DAILY_LIMIT a day in all (add EDU_PASSWORD in Render to require a password).
services:
  - type: web
    name: edu-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FIREWORKS_API_KEY
        sync: false
      - key: EDU_DAILY_LIMIT
        value: "20"
      # The free plan has a tenth of a CPU: give the lesson-code check more time to start.
      - key: EDU_SANDBOX_TIMEOUT_MS
        value: "20000"
